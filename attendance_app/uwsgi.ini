[uwsgi]
module = wsgi:application
chdir = /app/attendance_app

master = true
lazy-apps = true
enable-threads = true
processes = 2
threads = 2

http-socket = :$(PORT)
buffer-size = 8192
harakiri = 60
vacuum = true
die-on-term = true

; keep the process list quiet — this runs as PID 1 under docker/compose
disable-logging = false
log-4xx = true
log-5xx = true
