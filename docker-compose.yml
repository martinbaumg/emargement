services:
  attendance:
    build: .
    image: pass-reverse-attendance:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      # Mount path if served behind a reverse proxy on a sub-path, e.g. "/emargement".
      # Leave empty to serve at "/".
      BASE_URL_PATH: "${BASE_URL_PATH:-}"
    volumes:
      - attendance_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:8080' + os.environ.get('BASE_URL_PATH','') + '/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  attendance_data:
